# GitHub Pages deploy for the Vendí site.
# In the dedicated repository this file lives at .github/workflows/pages.yml
# and the site files (index.html, assets/, CNAME, robots.txt, sitemap.xml)
# live at the repository root.
name: Deploy Vendí to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html assets CNAME robots.txt sitemap.xml _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
