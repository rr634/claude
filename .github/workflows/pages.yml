# Deploys the DeedGuard USA site (titlelock/site/) to GitHub Pages.
#
# Live URL (free, no custom domain needed): https://rr634.github.io/claude/
# Runs automatically on push to main and can be run manually from the Actions tab.
# If the first run needs Pages turned on: Settings -> Pages -> Build and deployment
#   -> Source: "GitHub Actions".
name: Deploy DeedGuard to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "titlelock/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (strip CNAME so the free github.io URL works)
        run: |
          mkdir -p _site
          cp -R titlelock/site/. _site/
          rm -f _site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
