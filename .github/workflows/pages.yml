# Deploys the Breakwater Capital site (breakwater/site/) to GitHub Pages.
#
# This repository hosts the Breakwater site, served at its custom domain
# brkwatercap.com (see breakwater/site/CNAME).
#
# The DeedGuard USA site lives in its own repository (rr634/deedguard) and is
# NOT deployed from here — one GitHub Pages site can serve only one custom
# domain, so the two sites are kept in separate repositories.
#
# Free URL (no custom domain needed): https://rr634.github.io/claude/
# Runs automatically on push to main and can be run manually from the Actions tab.
# If the first run needs Pages turned on: Settings -> Pages -> Build and deployment
#   -> Source: "GitHub Actions".
name: Deploy Breakwater to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "breakwater/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: breakwater/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
